name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release + Debug APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/humo-alarm.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/humo-alarm-debug.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: humo-alarm-apk
          path: out/*.apk
          if-no-files-found: error
