plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'uz.humo.alarm'
    compileSdk 34

    defaultConfig {
        applicationId "uz.humo.alarm"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"

        // Telegram API ma'lumotlari build paytida muhitdan (CI secret) keladi - repoda saqlanmaydi
        buildConfigField "int", "TG_API_ID", (System.getenv("TG_API_ID") ?: "0")
        buildConfigField "String", "TG_API_HASH", "\"" + (System.getenv("TG_API_HASH") ?: "") + "\""

        // Telefonlar uchun faqat ARM ABI lar (APK kichikroq bo'ladi)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Release APK debug kalit bilan imzolanadi - foydalanuvchi to'g'ridan-to'g'ri o'rnata oladi
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // TDLib (Telegram MTProto klienti) - tayyor AAR, JitPack orqali (tdlibx/td, TDLib 1.8.56)
    implementation 'com.github.tdlibx:td:1.8.56'
}
